<script>
    let selectedListingType = "sale";
    let selectedPhotos = [];

    const client = supabase.createClient(
        TEKNIVO_CONFIG.SUPABASE_URL,
        TEKNIVO_CONFIG.SUPABASE_PUBLISHABLE_KEY
    );

    function waitForClerk(timeout = 15000) {
        return new Promise(resolve => {

            const start = Date.now();

            const check = () => {

                if (window.Clerk) {
                    resolve(true);
                    return;
                }

                if (Date.now() - start >= timeout) {
                    resolve(false);
                    return;
                }

                setTimeout(check, 100);
            };

            check();
        });
    }

    function showMessage(text, type = "error") {

        const message = document.getElementById("message");

        message.textContent = text;
        message.className = "message show " + type;

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    function selectListingType(type) {

        selectedListingType = type;

        const saleButton =
            document.getElementById("saleButton");

        const rentButton =
            document.getElementById("rentButton");

        const salePriceSection =
            document.getElementById("salePriceSection");

        const rentalBox =
            document.getElementById("rentalBox");

        if (type === "rent") {

            saleButton.classList.remove("active");
            rentButton.classList.add("active");

            salePriceSection.style.display = "none";

            rentalBox.classList.add("show");

        } else {

            rentButton.classList.remove("active");
            saleButton.classList.add("active");

            salePriceSection.style.display = "block";

            rentalBox.classList.remove("show");
        }
    }


    function getNumber(id) {

        const value =
            parseFloat(document.getElementById(id).value);

        return Number.isFinite(value) ? value : 0;
    }


    /*
     * FOTOĞRAF ÖNİZLEME
     */

    const photoInput =
        document.getElementById("photos");

    photoInput.addEventListener("change", function () {

        const files =
            Array.from(this.files || []);

        if (files.length > 8) {

            showMessage(
                "En fazla 8 fotoğraf seçebilirsin.",
                "error"
            );

            this.value = "";
            selectedPhotos = [];

            renderPhotoPreview();

            return;
        }

        const validFiles = [];

        for (const file of files) {

            if (!file.type.startsWith("image/")) {

                showMessage(
                    `"${file.name}" bir fotoğraf değil.`,
                    "error"
                );

                continue;
            }

            if (file.size > 8 * 1024 * 1024) {

                showMessage(
                    `"${file.name}" 8 MB'dan büyük.`,
                    "error"
                );

                continue;
            }

            validFiles.push(file);
        }

        selectedPhotos = validFiles;

        renderPhotoPreview();
    });


    function renderPhotoPreview() {

        const preview =
            document.getElementById("preview");

        preview.innerHTML = "";

        selectedPhotos.forEach((file, index) => {

            const item =
                document.createElement("div");

            item.className = "preview-item";

            const img =
                document.createElement("img");

            img.src = URL.createObjectURL(file);

            img.onload = () => {
                URL.revokeObjectURL(img.src);
            };

            const number =
                document.createElement("div");

            number.className = "preview-number";

            number.textContent =
                `${index + 1}. fotoğraf`;

            item.appendChild(img);
            item.appendChild(number);

            preview.appendChild(item);
        });
    }


    /*
     * FOTOĞRAFLARI SUPABASE STORAGE'A YÜKLE
     */

    async function uploadListingImages(listingId, userId) {

        if (!selectedPhotos.length) {
            return;
        }

        for (
            let index = 0;
            index < selectedPhotos.length;
            index++
        ) {

            const file =
                selectedPhotos[index];

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            const allowedExtensions = [
                "jpg",
                "jpeg",
                "png",
                "webp",
                "gif"
            ];

            const safeExtension =
                allowedExtensions.includes(extension)
                    ? extension
                    : "jpg";

            const randomName =
                typeof crypto !== "undefined" &&
                crypto.randomUUID
                    ? crypto.randomUUID()
                    : Date.now() + "-" + Math.random();

            const filePath =
                `${userId}/${listingId}/${randomName}.${safeExtension}`;


            const {
                error: uploadError
            } = await client
                .storage
                .from("listing-images")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false,
                        contentType: file.type
                    }
                );


            if (uploadError) {
                throw uploadError;
            }


            const {
                data: publicData
            } = client
                .storage
                .from("listing-images")
                .getPublicUrl(filePath);


            const imageUrl =
                publicData.publicUrl;


            const {
                error: imageInsertError
            } = await client
                .from("listing_images")
                .insert({
                    listing_id: listingId,
                    image_url: imageUrl,
                    sort_order: index
                });


            if (imageInsertError) {

                await client
                    .storage
                    .from("listing-images")
                    .remove([filePath]);

                throw imageInsertError;
            }
        }
    }


    /*
     * URL'DEN KİRALIK AÇMA
     *
     * /ilan-ver.html?type=rent
     */

    const params =
        new URLSearchParams(window.location.search);

    if (params.get("type") === "rent") {
        selectListingType("rent");
    }


    /*
     * CLERK KONTROLÜ
     */

    async function checkLogin() {

        const ready =
            await waitForClerk();

        if (!ready) {

            showMessage(
                "Giriş sistemi yüklenemedi. Sayfayı yenileyip tekrar dene.",
                "error"
            );

            return;
        }

        await window.Clerk.load();

        if (
            !window.Clerk.isSignedIn ||
            !window.Clerk.user
        ) {

            document
                .getElementById("formArea")
                .style.display = "none";

            document
                .getElementById("loginWarning")
                .classList.add("show");

            return;
        }

        console.log(
            "TEKNIVO: Giriş yapan kullanıcı:",
            window.Clerk.user.id
        );
    }


    /*
     * FORM GÖNDERME
     */

    document
        .getElementById("listingForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const submitButton =
                document.getElementById("submitButton");

            const ready =
                await waitForClerk();

            if (!ready) {

                showMessage(
                    "Giriş sistemi yüklenemedi.",
                    "error"
                );

                return;
            }

            await window.Clerk.load();


            if (
                !window.Clerk.isSignedIn ||
                !window.Clerk.user
            ) {

                showMessage(
                    "İlan vermek için önce giriş yapmalısın.",
                    "error"
                );

                setTimeout(() => {
                    window.location.href =
                        "/giris.html";
                }, 1000);

                return;
            }


            const userId =
                window.Clerk.user.id;


            const title =
                document
                    .getElementById("title")
                    .value
                    .trim();

            const category =
                document
                    .getElementById("category")
                    .value;

            const brand =
                document
                    .getElementById("brand")
                    .value
                    .trim();

            const model =
                document
                    .getElementById("model")
                    .value
                    .trim();

            const condition =
                document
                    .getElementById("condition")
                    .value;

            const city =
                document
                    .getElementById("city")
                    .value;

            const description =
                document
                    .getElementById("description")
                    .value
                    .trim();


            if (!title) {
                showMessage(
                    "İlan başlığı gir.",
                    "error"
                );
                return;
            }

            if (!category) {
                showMessage(
                    "Kategori seç.",
                    "error"
                );
                return;
            }

            if (!condition) {
                showMessage(
                    "Ürün durumunu seç.",
                    "error"
                );
                return;
            }

            if (!city) {
                showMessage(
                    "Şehir seç.",
                    "error"
                );
                return;
            }

            if (!description) {
                showMessage(
                    "Açıklama gir.",
                    "error"
                );
                return;
            }


            let price = 0;
            let dailyPrice = null;
            let weeklyPrice = null;
            let deposit = null;


            /*
             * SATILIK
             */

            if (selectedListingType === "sale") {

                price =
                    getNumber("price");

                if (price <= 0) {

                    showMessage(
                        "Geçerli bir satış fiyatı gir.",
                        "error"
                    );

                    return;
                }
            }


            /*
             * KİRALIK
             */

            if (selectedListingType === "rent") {

                dailyPrice =
                    getNumber("daily_price");

                weeklyPrice =
                    getNumber("weekly_price");

                deposit =
                    getNumber("deposit");


                if (dailyPrice <= 0) {

                    showMessage(
                        "Günlük kira fiyatını gir.",
                        "error"
                    );

                    return;
                }


                /*
                 * Mevcut sistemde price alanı
                 * zorunluysa günlük fiyatı
                 * price alanına da yazıyoruz.
                 */

                price = dailyPrice;


                if (weeklyPrice <= 0) {
                    weeklyPrice = null;
                }

                if (deposit <= 0) {
                    deposit = null;
                }
            }


            submitButton.disabled = true;

            submitButton.textContent =
                "İlan oluşturuluyor...";


            try {

                /*
                 * İLANI OLUŞTUR
                 */

                const listingData = {

                    user_id: userId,

                    title: title,

                    category: category,

                    brand: brand || null,

                    model: model || null,

                    condition: condition,

                    price: price,

                    city: city,

                    description: description,

                    listing_type:
                        selectedListingType,

                    daily_price:
                        dailyPrice,

                    weekly_price:
                        weeklyPrice,

                    deposit:
                        deposit,

                    status: "active"
                };


                const {
                    data: listing,
                    error: listingError
                } = await client
                    .from("listings")
                    .insert(listingData)
                    .select()
                    .single();


                if (listingError) {
                    throw listingError;
                }


                /*
                 * FOTOĞRAFLARI YÜKLE
                 */

                if (selectedPhotos.length > 0) {

                    submitButton.textContent =
                        "Fotoğraflar yükleniyor...";

                    await uploadListingImages(
                        listing.id,
                        userId
                    );
                }


                /*
                 * BAŞARILI
                 */

                showMessage(
                    "İlanın başarıyla yayınlandı! 🎉",
                    "success"
                );


                submitButton.textContent =
                    "İlan Yayınlandı ✓";


                setTimeout(() => {

                    window.location.href = "/";

                }, 1500);


            } catch (error) {

                console.error(
                    "TEKNIVO ilan oluşturma hatası:",
                    error
                );

                showMessage(
                    error.message ||
                    "İlan oluşturulurken bir hata oluştu.",
                    "error"
                );

                submitButton.disabled = false;

                submitButton.textContent =
                    "İlanı Yayınla";
            }

        });


    /*
     * SAYFA AÇILINCA
     */

    checkLogin();

</script>

</body>
</html>
