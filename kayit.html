    <style>
        * {

        body {

        .auth-page {

        .auth-box {

        .auth-logo span {

        }

        .auth-subtitle {
            text-align: center;

        }

        .auth-box h1 {
            font-size: 24px;
            margin: 0 0 20px;
        }

        .auth-field {
            margin-bottom: 15px;
        }

        .auth-field label {
            display: block;
            font-size: 12px;

        .auth-field input {
            width: 100%;

            padding: 0 13px;
            border: 1px solid #ddd;

        .auth-field input:focus {
            border-color: #635bff;

        .auth-button {
            width: 100%;

        .google-button {
            width: 100%;

        .google-button:hover {

        .divider {

        .auth-message {

        .auth-message.error {

        .auth-message.success {

        .verification-box {
            display: none;

        }

        .verification-box.show {
            display: block;
        }

        .verification-title {

        }

        .verification-text {
            color: #777;
            font-size: 13px;

        }

        .code-input {
            width: 100%;
            height: 50px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 0 15px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 6px;
            outline: none;
        }

        .code-input:focus {
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, .08);
        }

        .verify-button {
            width: 100%;
            height: 47px;
            margin-top: 12px;
            border: 0;
            border-radius: 8px;
            background: #635bff;
            color: #fff;
            font-weight: 900;
            cursor: pointer;
        }

        .verify-button:disabled {
            opacity: .6;

        }

        .resend-button {
            width: 100%;
            margin-top: 12px;
            border: 0;
            background: transparent;
            color: #635bff;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        .resend-button:disabled {
            opacity: .5;
            cursor: wait;
        }

        .auth-bottom {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 13px;
        }

        .auth-bottom a {
            color: #635bff;
            font-weight: 800;
            text-decoration: none;
        }

        .auth-bottom a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
            text-decoration: none;
        }

        .back-home:hover {
            color: #171717;
        }

        @media (max-width: 480px) {
            .auth-page {
                padding: 15px;

            .auth-box {

    </style>

<body>

<div class="auth-page">

    <div class="auth-box">

        <!-- LOGO -->
        <div class="auth-logo">
            TEKNIVO<span>.</span>
        </div>

        <div class="auth-subtitle">
            Teknoloji almanın ve satmanın kolay yolu.
        </div>

        <h1>
            Hesap Oluştur
        </h1>

        <!-- MESAJ -->
        <div
            id="message"
            class="auth-message">
        </div>

        <!-- =========================
             KAYIT ALANI
        ========================== -->

        <div id="registerArea">

            <!-- GOOGLE -->
            <button
                id="googleButton"
                class="google-button"
                type="button">

                🔵 Google ile Kayıt Ol

            </button>

            <div class="divider">
                veya e-posta ile
            </div>

            <!-- REGISTER FORM -->
            <form id="registerForm">

                <div class="auth-field">

                    <label for="username">
                        Kullanıcı adı
                    </label>

                    <input
                        id="username"
                        type="text"
                        placeholder="kullaniciadi"
                        autocomplete="username"
                        minlength="3"
                        maxlength="30"
                        required>

                </div>

                <div class="auth-field">

                    <label for="city">
                        Şehir
                    </label>

                    <input
                        id="city"
                        type="text"
                        placeholder="Batman"
                        maxlength="50"
                        required>

                </div>

                <div class="auth-field">

                    <label for="email">
                        E-posta
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="ornek@mail.com"
                        autocomplete="email"
                        required>

                </div>

                <div class="auth-field">

                    <label for="password">
                        Şifre
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="En az 8 karakter"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                </div>

                <div class="auth-field">

                    <label for="password2">
                        Şifre tekrar
                    </label>

                    <input
                        id="password2"
                        type="password"
                        placeholder="Şifreni tekrar yaz"
                        autocomplete="new-password"
                        minlength="8"
                        required>

                </div>

                <button
                    id="registerButton"
                    class="auth-button"
                    type="submit">

                    Kayıt Ol

                </button>

            </form>

        </div>


        <!-- =========================
             E-POSTA DOĞRULAMA
        ========================== -->

        <div
            id="verificationBox"
            class="verification-box">

            <div class="verification-title">
                E-posta adresini doğrula
            </div>

            <div class="verification-text">
                E-posta adresine gönderdiğimiz doğrulama
                kodunu aşağıya gir.
            </div>

            <input
                id="verificationCode"
                class="code-input"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="10"
                placeholder="000000">

            <button
                id="verifyButton"
                class="verify-button"
                type="button">

                E-postayı Doğrula

            </button>

            <button
                id="resendButton"
                class="resend-button"
                type="button">

                Kodu tekrar gönder

            </button>

        </div>


        <!-- LOGIN -->
        <div class="auth-bottom">

            Zaten hesabın var mı?

            <a href="/giris.html">
                Giriş Yap
            </a>

        </div>


        <!-- HOME -->
        <a
            href="/"
            class="back-home">

            ← Ana sayfaya dön

        </a>

    </div>

</div>


<script>
"use strict";

/* =========================================
   ELEMENTLER
========================================= */

const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const googleButton =
    document.getElementById("googleButton");

const message =
    document.getElementById("message");

const registerArea =
    document.getElementById("registerArea");

const verificationBox =
    document.getElementById("verificationBox");

const verificationCode =
    document.getElementById("verificationCode");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");

let currentSignUp = null;


/* =========================================
   MESAJ GÖSTER
========================================= */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "auth-message " + type;
}


/* =========================================
   CLERK BEKLE
========================================= */

async function waitForClerk() {

    for (let i = 0; i < 150; i++) {

        if (
            window.Clerk &&
            typeof window.Clerk.load === "function"
        ) {

            try {

                await window.Clerk.load();

                return true;

            } catch (error) {

                console.error(
                    "Clerk yükleme hatası:",
                    error
                );

                return false;
            }
        }

        await new Promise(function(resolve) {

            setTimeout(resolve, 100);

        });
    }

    return false;
}


/* =========================================
   HATA MESAJI
========================================= */

function getClerkError(error, fallback) {

    if (
        error &&
        error.errors &&
        error.errors.length > 0
    ) {

        return (
            error.errors[0].longMessage ||
            error.errors[0].message ||
            fallback
        );
    }

    if (error && error.message) {

        return error.message;
    }

    return fallback;
}


/* =========================================
   SAYFA AÇILIŞI
========================================= */

(async function () {

    const ready =
        await waitForClerk();

    if (!ready) {

        showMessage(
            "Kayıt sistemi yüklenemedi. Sayfayı yenileyip tekrar deneyin.",
            "error"
        );

        return;
    }

    console.log(
        "TEKNIVO: Clerk hazır."
    );

    console.log(
        "TEKNIVO: Giriş durumu:",
        window.Clerk.isSignedIn
    );

    /*
     * Kullanıcı zaten giriş yaptıysa
     * kayıt sayfasında kalmasın.
     */

    if (window.Clerk.isSignedIn) {

        window.location.href = "/";

    }

})();


/* =========================================
   GOOGLE KAYIT
========================================= */

googleButton.addEventListener(
    "click",
    async function () {

        googleButton.disabled = true;

        googleButton.textContent =
            "Google açılıyor...";

        try {

            const ready =
                await waitForClerk();

            if (!ready) {

                throw new Error(
                    "Clerk yüklenemedi."
                );
            }

            console.log(
                "TEKNIVO: Google kayıt başlatılıyor..."
            );

            await window.Clerk.client.signUp
                .authenticateWithRedirect({

                    strategy:
                        "oauth_google",

                    redirectUrl:
                        window.location.origin + "/",

                    redirectUrlComplete:
                        window.location.origin + "/"

                });

        } catch (error) {

            console.error(
                "TEKNIVO Google kayıt hatası:",
                error
            );

            showMessage(
                getClerkError(
                    error,
                    "Google ile kayıt yapılamadı."
                ),
                "error"
            );

            googleButton.disabled = false;

            googleButton.textContent =
                "🔵 Google ile Kayıt Ol";
        }

    }
);


/* =========================================
   E-POSTA KAYIT
========================================= */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const city =
            document
                .getElementById("city")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const password2 =
            document
                .getElementById("password2")
                .value;


        /* =================================
           KONTROLLER
        ================================= */

        if (username.length < 3) {

            showMessage(
                "Kullanıcı adı en az 3 karakter olmalı.",
                "error"
            );

            return;
        }


        if (!/^[a-zA-Z0-9_.-]+$/.test(username)) {

            showMessage(
                "Kullanıcı adında sadece harf, rakam, nokta, tire ve alt çizgi kullanabilirsin.",
                "error"
            );

            return;
        }


        if (!city) {

            showMessage(
                "Şehir bilgisini yaz.",
                "error"
            );

            return;
        }


        if (password.length < 8) {

            showMessage(
                "Şifre en az 8 karakter olmalı.",
                "error"
            );

            return;
        }


        if (password !== password2) {

            showMessage(
                "Şifreler aynı değil.",
                "error"
            );

            return;
        }


        /* =================================
           BUTON
        ================================= */

        button.disabled = true;

        button.textContent =
            "Hesap oluşturuluyor...";


        try {

            /* =============================
               CLERK HAZIR MI?
            ============================= */

            const ready =
                await waitForClerk();

            if (!ready) {

                throw new Error(
                    "Clerk yüklenemedi."
                );
            }


            /* =============================
               ZATEN GİRİŞ VAR MI?
            ============================= */

            if (window.Clerk.isSignedIn) {

                window.location.href = "/";

                return;
            }


            console.log(
                "TEKNIVO: Clerk kayıt oluşturuluyor..."
            );


            /* =============================
               SIGN UP
            ============================= */

            currentSignUp =
                await window.Clerk.client.signUp.create({

                    emailAddress:
                        email,

                    password:
                        password

                });


            console.log(
                "TEKNIVO: SignUp oluşturuldu:",
                currentSignUp
            );


            /* =============================
               KULLANICI BİLGİLERİ
            ============================= */

            try {

                await currentSignUp.update({

                    unsafeMetadata: {

                        username:
                            username,

                        city:
                            city

                    }

                });

            } catch (metadataError) {

                /*
                 * Metadata kaydı başarısız olsa bile
                 * hesabın oluşturulmasını engelleme.
                 */

                console.warn(
                    "Kullanıcı bilgileri metadata'ya yazılamadı:",
                    metadataError
                );
            }


            /* =============================
               E-POSTA DOĞRULAMA
            ============================= */

            await currentSignUp
                .prepareEmailAddressVerification({

                    strategy:
                        "email_code"

                });


            console.log(
                "TEKNIVO: Doğrulama kodu gönderildi."
            );


            /* =============================
               FORMU GİZLE
            ============================= */

            registerArea.style.display =
                "none";


            /* =============================
               DOĞRULAMA EKRANINI GÖSTER
            ============================= */

            verificationBox.classList.add(
                "show"
            );


            showMessage(
                "Doğrulama kodu e-posta adresine gönderildi.",
                "success"
            );


            verificationCode.focus();


        } catch (error) {

            console.error(
                "TEKNIVO kayıt hatası:",
                error
            );


            showMessage(
                getClerkError(
                    error,
                    "Kayıt oluşturulamadı."
                ),
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Kayıt Ol";
        }

    }
);


/* =========================================
   E-POSTA DOĞRULAMA
========================================= */

verifyButton.addEventListener(
    "click",
    async function () {

        const code =
            verificationCode.value.trim();


        if (!currentSignUp) {

            showMessage(
                "Kayıt oturumu bulunamadı. Lütfen tekrar kayıt ol.",
                "error"
            );

            return;
        }


        if (!code) {

            showMessage(
                "E-posta doğrulama kodunu gir.",
                "error"
            );

            verificationCode.focus();

            return;
        }


        verifyButton.disabled = true;

        verifyButton.textContent =
            "Doğrulanıyor...";


        try {

            console.log(
                "TEKNIVO: E-posta doğrulanıyor..."
            );


            await currentSignUp
                .attemptEmailAddressVerification({

                    code:
                        code

                });


            console.log(
                "TEKNIVO doğrulama durumu:",
                currentSignUp.status
            );


            /* =============================
               KAYIT TAMAMLANDI
            ============================= */

            if (
                currentSignUp.status ===
                "complete"
            ) {

                if (
                    currentSignUp.createdSessionId
                ) {

                    await window.Clerk.setActive({

                        session:
                            currentSignUp.createdSessionId

                    });

                }


                showMessage(
                    "Hesabın başarıyla oluşturuldu! Ana sayfaya yönlendiriliyorsun...",
                    "success"
                );


                setTimeout(function () {

                    window.location.href =
                        "/";

                }, 1000);


                return;
            }


            /* =============================
               EK DOĞRULAMA
            ============================= */

            showMessage(
                "E-posta doğrulandı ancak hesap henüz tamamlanmadı.",
                "error"
            );


            verifyButton.disabled = false;

            verifyButton.textContent =
                "E-postayı Doğrula";


        } catch (error) {

            console.error(
                "TEKNIVO e-posta doğrulama hatası:",
                error
            );


            showMessage(
                getClerkError(
                    error,
                    "Doğrulama kodu geçersiz."
                ),
                "error"
            );


            verifyButton.disabled = false;

            verifyButton.textContent =
                "E-postayı Doğrula";
        }

    }
);


/* =========================================
   KODU TEKRAR GÖNDER
========================================= */

resendButton.addEventListener(
    "click",
    async function () {

        if (!currentSignUp) {

            showMessage(
                "Kayıt oturumu bulunamadı.",
                "error"
            );

            return;
        }


        resendButton.disabled = true;

        resendButton.textContent =
            "Kod gönderiliyor...";


        try {

            await currentSignUp
                .prepareEmailAddressVerification({

                    strategy:
                        "email_code"

                });


            showMessage(
                "Yeni doğrulama kodu e-posta adresine gönderildi.",
                "success"
            );


        } catch (error) {

            console.error(
                "TEKNIVO kod gönderme hatası:",
                error
            );


            showMessage(
                getClerkError(
                    error,
                    "Kod gönderilemedi."
                ),
                "error"
            );

        }


        setTimeout(function () {

            resendButton.disabled = false;

            resendButton.textContent =
                "Kodu tekrar gönder";

        }, 3000);

    }
);


/* =========================================
   ENTER İLE DOĞRULAMA
========================================= */

verificationCode.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            event.preventDefault();

            verifyButton.click();

        }

    }
);


/* =========================================
   KOD SADECE RAKAM
========================================= */

verificationCode.addEventListener(
    "input",
    function () {

        this.value =
            this.value.replace(/\D/g, "");

    }
);

</script>

</body>
