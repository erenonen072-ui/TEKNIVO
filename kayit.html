<body>

<div class="auth-page">

    <div class="auth-box">

        <!-- LOGO -->
        <div class="auth-logo">
            TEKNIVO<span>.</span>
        </div>

        <div class="auth-subtitle">
            Teknoloji almanın ve satmanın kolay yolu.
        </div>

        <h1>
            Hesap Oluştur
        </h1>

        <!-- MESAJ -->
        <div
            id="message"
            class="auth-message">
        </div>

        <!-- =========================
             REGISTER AREA
        ========================== -->

        <div id="registerArea">

            <!-- GOOGLE -->
            <button
                id="googleButton"
                class="google-button"
                type="button">
                🔵 Google ile Kayıt Ol
            </button>

            <div class="divider">
                veya e-posta ile
            </div>

            <!-- REGISTER FORM -->
            <form id="registerForm">

                <div class="auth-field">

                    <label for="username">

                    </label>

                    <input
                        id="username"

                </div>

                    <label for="city">

                    <input
                        id="city"
                        type="text"
                        placeholder="Batman"
                        maxlength="50"
                        required
                    >

                </div>

                    <label for="email">
                        E-posta
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="ornek@mail.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="password">
                        Şifre
                    </label>

                    <input
                        id="password"
                        type="password"
                        placeholder="En az 8 karakter"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <div class="auth-field">

                    <label for="password2">
                        Şifre tekrar
                    </label>

                    <input
                        id="password2"
                        type="password"
                        placeholder="Şifreni tekrar yaz"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                </div>


                <button
                    id="registerButton"
                    class="auth-button"

                inputmode="numeric"

                maxlength="10"

                id="verifyButton"

                type="button">

<script>
"use strict";

/* =====================================
   ELEMENTLER
===================================== */

const form =
    document.getElementById("registerForm");

const button =
    document.getElementById("registerButton");

const googleButton =
    document.getElementById("googleButton");

const message =
    document.getElementById("message");

const registerArea =
    document.getElementById("registerArea");

const verificationBox =
    document.getElementById("verificationBox");

const verificationCode =
    document.getElementById("verificationCode");

const verifyButton =
    document.getElementById("verifyButton");

const resendButton =
    document.getElementById("resendButton");


let currentSignUp = null;


/* =====================================
   MESAJ
===================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "auth-message " + type;
}


/* =====================================
   CLERK BEKLE
===================================== */

async function waitForClerk() {

    for (let i = 0; i < 100; i++) {

        if (
            window.Clerk &&
            typeof window.Clerk.load === "function"
        ) {

            await window.Clerk.load();

            return true;
        }

        await new Promise(function(resolve) {

            setTimeout(resolve, 100);

        });

    }

    return false;
}


/* =====================================
   SAYFA AÇILINCA
===================================== */

(async function () {

    const ready =
        await waitForClerk();

    if (!ready) {

        showMessage(
            "Kayıt sistemi yüklenemedi. Sayfayı yenileyip tekrar deneyin.",
            "error"
        );

        return;
    }


    if (window.Clerk.isSignedIn) {

        window.location.href = "/";

    }

})();


/* =====================================
   GOOGLE KAYIT
===================================== */

googleButton.addEventListener(
    "click",
    async function () {

        googleButton.disabled = true;

        googleButton.textContent =
            "Google açılıyor...";


        try {

            const ready =
                await waitForClerk();


            if (!ready) {

                throw new Error(
                    "Clerk yüklenemedi."
                );

            }


            await window.Clerk.client.signUp
                .authenticateWithRedirect({

                    strategy: "oauth_google",

                    redirectUrl:
                        window.location.origin + "/",

                    redirectUrlComplete:
                        window.location.origin + "/"

                });

        }

        catch (error) {

            console.error(
                "Google kayıt hatası:",
                error
            );


            showMessage(
                error?.errors?.[0]?.longMessage ||
                error?.errors?.[0]?.message ||
                error?.message ||
                "Google ile kayıt yapılamadı.",
                "error"
            );


            googleButton.disabled = false;

            googleButton.textContent =
                "🔵 Google ile Kayıt Ol";
        }

    }
);


/* =====================================
   E-POSTA KAYIT
===================================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const username =
            document
                .getElementById("username")
                .value
                .trim();


        const city =
            document
                .getElementById("city")
                .value
                .trim();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        const password2 =
            document
                .getElementById("password2")
                .value;


        /* KONTROLLER */

        if (username.length < 3) {

            showMessage(
                "Kullanıcı adı en az 3 karakter olmalı.",
                "error"
            );

            return;
        }


        if (!city) {

            showMessage(
                "Şehir bilgisini yaz.",
                "error"
            );

            return;
        }


        if (password.length < 8) {

            showMessage(
                "Şifre en az 8 karakter olmalı.",
                "error"
            );

            return;
        }


        if (password !== password2) {

            showMessage(
                "Şifreler aynı değil.",
                "error"
            );

            return;
        }


        button.disabled = true;

        button.textContent =
            "Hesap oluşturuluyor...";


        try {

            const ready =
                await waitForClerk();


            if (!ready) {

                throw new Error(
                    "Clerk yüklenemedi."
                );

            }


            /* =========================
               CLERK SIGN UP
            ========================== */

            currentSignUp =
                await window.Clerk.client.signUp.create({

                    emailAddress: email,

                    password: password

                });


            /* =========================
               KULLANICI BİLGİLERİ
            ========================== */

            await currentSignUp.update({

                unsafeMetadata: {

                    username: username,

                    city: city

                }

            });


            /* =========================
               E-POSTA DOĞRULAMA
            ========================== */

            await currentSignUp
                .prepareEmailAddressVerification({

                    strategy: "email_code"

                });


            /* FORMU GİZLE */

            registerArea.style.display =
                "none";


            /* DOĞRULAMA EKRANINI AÇ */

            verificationBox.classList.add("show");


            showMessage(
                "Doğrulama kodu e-posta adresine gönderildi.",
                "success"
            );


            verificationCode.focus();

        }

        catch (error) {

            console.error(
                "TEKNIVO kayıt hatası:",
                error
            );


            let errorMessage =
                "Kayıt oluşturulamadı.";


            if (
                error?.errors &&
                error.errors.length > 0
            ) {

                errorMessage =
                    error.errors[0].longMessage ||
                    error.errors[0].message ||
                    errorMessage;

            }

            else if (error?.message) {

                errorMessage =
                    error.message;

            }


            showMessage(
                errorMessage,
                "error"
            );


            button.disabled = false;

            button.textContent =
                "Kayıt Ol";
        }

    }
);


/* =====================================
   E-POSTA DOĞRULAMA
===================================== */

verifyButton.addEventListener(
    "click",
    async function () {

        const code =
            verificationCode.value.trim();


        if (!currentSignUp) {

            showMessage(
                "Kayıt oturumu bulunamadı. Lütfen tekrar kayıt ol.",
                "error"
            );

            return;
        }


        if (!code) {

            showMessage(
                "E-posta doğrulama kodunu gir.",
                "error"
            );

            return;
        }


        verifyButton.disabled = true;

        verifyButton.textContent =
            "Doğrulanıyor...";


        try {

            await currentSignUp
                .attemptEmailAddressVerification({

                    code: code

                });


            /*
             * Doğrulama tamamlandıysa
             */

            if (
                currentSignUp.status === "complete"
            ) {

                await window.Clerk.setActive({

                    session:
                        currentSignUp.createdSessionId

                });


                showMessage(
                    "Hesabın başarıyla oluşturuldu! Ana sayfaya yönlendiriliyorsun...",
                    "success"
                );


                setTimeout(function () {

                    window.location.href = "/";

                }, 1000);


                return;
            }


            showMessage(
                "E-posta doğrulandı ancak hesap henüz tamamlanmadı.",
                "error"
            );


            verifyButton.disabled = false;

            verifyButton.textContent =
                "E-postayı Doğrula";

        }

        catch (error) {

            console.error(
                "E-posta doğrulama hatası:",
                error
            );


            showMessage(
                error?.errors?.[0]?.longMessage ||
                error?.errors?.[0]?.message ||
                error?.message ||
                "Doğrulama kodu geçersiz.",
                "error"
            );


            verifyButton.disabled = false;

            verifyButton.textContent =
                "E-postayı Doğrula";
        }

    }
);


/* =====================================
   KODU TEKRAR GÖNDER
===================================== */

resendButton.addEventListener(
    "click",
    async function () {

        if (!currentSignUp) {

            showMessage(
                "Kayıt oturumu bulunamadı.",
                "error"
            );

            return;
        }


        resendButton.disabled = true;

        resendButton.textContent =
            "Kod gönderiliyor...";


        try {

            await currentSignUp
                .prepareEmailAddressVerification({

                    strategy: "email_code"

                });


            showMessage(
                "Yeni doğrulama kodu e-posta adresine gönderildi.",
                "success"
            );

        }

        catch (error) {

            console.error(
                "Kod gönderme hatası:",
                error
            );


            showMessage(
                error?.errors?.[0]?.longMessage ||
                error?.message ||
                "Kod gönderilemedi.",
                "error"
            );

        }


        setTimeout(function () {

            resendButton.disabled = false;

            resendButton.textContent =
                "Kodu tekrar gönder";

        }, 3000);

    }
);


/* =====================================
   ENTER İLE DOĞRULAMA
===================================== */

verificationCode.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {
