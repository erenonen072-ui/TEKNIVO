<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Giriş Yap - TEKNIVO</title>

    <link rel="stylesheet" href="/style.css">

    <!-- CLERK -->
    <script
        defer
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_ZW5vdWdoLXN0dXJnZW9uLTIwNDEuY2xlcmsuYWNjb3VudHMuZGV2JA"
        src="https://oceanic-capybara-20.clerk.accounts.dev/npm/@clerk/clerk-js@6/dist/clerk.browser.js">
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: #f7f7f8;
            color: #171717;
        }

        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            background: #fff;
            border: 1px solid #e7e7e7;
            border-radius: 18px;
            padding: 35px;
            box-shadow:
                0 15px 50px rgba(0,0,0,.06);
        }

        .auth-logo {
            text-align: center;
            font-size: 30px;
            font-weight: 950;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
        }

        .auth-logo span {
            color: #635bff;
        }

        .auth-subtitle {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .auth-box h1 {
            font-size: 24px;
            margin: 0 0 20px;
        }

        .google-button {
            width: 100%;
            height: 47px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fff;
            color: #171717;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }

        .google-button:hover {
            background: #f7f7f7;
        }

        .google-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            color: #999;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e7e7e7;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            font-size: 12px;
            font-weight: 800;
            margin-bottom: 7px;
        }

        .auth-field input {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }

        .auth-field input:focus {
            border-color: #635bff;
            box-shadow:
                0 0 0 3px rgba(99,91,255,.08);
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: -7px;
            margin-bottom: 16px;
            color: #635bff;
            font-size: 12px;
            font-weight: 700;
            text-decoration: none;
        }

        .auth-button {
            width: 100%;
            height: 47px;
            border: 0;
            border-radius: 8px;
            background: #635bff;
            color: white;
            font-weight: 900;
            cursor: pointer;
            font-size: 14px;
        }

        .auth-button:hover {
            background: #5148e5;
        }

        .auth-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .auth-message {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.5;
        }

        .auth-message.error {
            display: block;
            background: #fff0f0;
            color: #c62828;
            border: 1px solid #ffd0d0;
        }

        .auth-message.success {
            display: block;
            background: #effcf3;
            color: #218838;
            border: 1px solid #c9efd2;
        }

        .auth-bottom {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 13px;
        }

        .auth-bottom a {
            color: #635bff;
            font-weight: 800;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 12px;
            text-decoration: none;
        }

    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            TEKNIVO<span>.</span>
        </div>

        <div class="auth-subtitle">
            Teknoloji almanın ve satmanın kolay yolu.
        </div>

        <h1>
            Giriş Yap
        </h1>

        <div
            id="message"
            class="auth-message">
        </div>


        <!-- GOOGLE -->

        <button
            id="googleButton"
            class="google-button"
            type="button">

            🔵 Google ile Giriş Yap

        </button>


        <div class="divider">
            veya e-posta ile
        </div>


        <!-- LOGIN FORM -->

        <form id="loginForm">

            <div class="auth-field">

                <label for="email">
                    E-posta
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="ornek@mail.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="auth-field">

                <label for="password">
                    Şifre
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Şifren"
                    autocomplete="current-password"
                    required
                >

            </div>


            <a
                href="#"
                id="forgotPassword"
                class="forgot">

                Şifremi unuttum

            </a>


            <button
                id="loginButton"
                class="auth-button"
                type="submit">

                Giriş Yap

            </button>

        </form>


        <div class="auth-bottom">

            Hesabın yok mu?

            <a href="kayit.html">
                Kayıt Ol
            </a>

        </div>


        <a
            href="/"
            class="back-home">

            ← Ana sayfaya dön

        </a>

    </div>

</div>


<script>

"use strict";


/* =====================================
   ELEMENTLER
===================================== */

const form =
    document.getElementById(
        "loginForm"
    );

const loginButton =
    document.getElementById(
        "loginButton"
    );

const googleButton =
    document.getElementById(
        "googleButton"
    );

const forgotPassword =
    document.getElementById(
        "forgotPassword"
    );

const message =
    document.getElementById(
        "message"
    );


/* =====================================
   MESAJ
===================================== */

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "auth-message " + type;

}


/* =====================================
   CLERK BEKLE
===================================== */

async function waitForClerk() {

    for (
        let i = 0;
        i < 100;
        i++
    ) {

        if (
            window.Clerk &&
            typeof Clerk.load === "function"
        ) {

            await Clerk.load();

            return true;

        }

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    100
                )
        );

    }

    return false;

}


/* =====================================
   SAYFA AÇILINCA
===================================== */

(async function () {

    const ready =
        await waitForClerk();


    if (!ready) {

        showMessage(
            "Giriş sistemi yüklenemedi. Sayfayı yenileyip tekrar deneyin.",
            "error"
        );

        return;

    }


    /*
     * Zaten giriş yapılmışsa
     * ana sayfaya gönder.
     */

    if (Clerk.isSignedIn) {

        window.location.href = "/";

    }

})();


/* =====================================
   GOOGLE GİRİŞ
===================================== */

googleButton.addEventListener(
    "click",
    async function () {

        googleButton.disabled = true;

        googleButton.textContent =
            "Google açılıyor...";


        try {

            const ready =
                await waitForClerk();


            if (!ready) {

                throw new Error(
                    "Clerk yüklenemedi."
                );

            }


            await Clerk.client.signIn.authenticateWithRedirect({

                strategy:
                    "oauth_google",

                redirectUrl:
                    window.location.origin +
                    "/",

                redirectUrlComplete:
                    window.location.origin +
                    "/"

            });

        }

        catch (error) {

            console.error(
                "Google giriş hatası:",
                error
            );


            showMessage(
                error?.errors?.[0]?.longMessage ||
                error?.message ||
                "Google ile giriş yapılamadı.",
                "error"
            );


            googleButton.disabled = false;

            googleButton.textContent =
                "🔵 Google ile Giriş Yap";

        }

    }
);


/* =====================================
   E-POSTA + ŞİFRE GİRİŞ
===================================== */

form.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        const password =
            document
                .getElementById("password")
                .value;


        if (!email || !password) {

            showMessage(
                "E-posta ve şifre alanlarını doldur.",
                "error"
            );

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Giriş yapılıyor...";


        try {

            const ready =
                await waitForClerk();


            if (!ready) {

                throw new Error(
                    "Clerk yüklenemedi."
                );

            }


            /*
             * Clerk Sign In
             */

            const signIn =
                await Clerk.client.signIn.create({
                    identifier: email,
                    password: password
                });


            /*
             * Giriş tamamlandıysa
             */

            if (
                signIn.status ===
                "complete"
            ) {

                await Clerk.setActive({
                    session:
                        signIn.createdSessionId
                });


                showMessage(
                    "Giriş başarılı! Ana sayfaya yönlendiriliyorsun...",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "/";

                    },
                    700
                );


                return;

            }


            /*
             * Ek doğrulama gerekiyorsa
             */

            showMessage(
                "Giriş için ek bir doğrulama gerekiyor. Lütfen hesabını doğrula.",
                "error"
            );


            console.log(
                "Clerk giriş durumu:",
                signIn.status
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Giriş Yap";

        }

        catch (error) {

            console.error(
                "TEKNIVO giriş hatası:",
                error
            );


            let errorMessage =
                "E-posta veya şifre hatalı.";


            if (
                error?.errors &&
                error.errors.length > 0
            ) {

                errorMessage =
                    error.errors[0].longMessage ||
                    error.errors[0].message ||
                    errorMessage;

            }

            else if (
                error?.message
            ) {

                errorMessage =
                    error.message;

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled = false;

            loginButton.textContent =
                "Giriş Yap";

        }

    }
);


/* =====================================
   ŞİFREMİ UNUTTUM
===================================== */

forgotPassword.addEventListener(
    "click",
    async function (event) {

        event.preventDefault();


        const email =
            document
                .getElementById("email")
                .value
                .trim()
                .toLowerCase();


        if (!email) {

            showMessage(
                "Önce e-posta adresini yaz.",
                "error"
            );

            document
                .getElementById("email")
                .focus();

            return;

        }


        try {

            const ready =
                await waitForClerk();


            if (!ready) {

                throw new Error(
                    "Clerk yüklenemedi."
                );

            }


            /*
             * Şifre sıfırlama
             */

            const signIn =
                await Clerk.client.signIn.create({
                    identifier: email
                });


            await signIn.prepareFirstFactor({
                strategy:
                    "reset_password_email_code"
            });


            const code =
                prompt(
                    "E-posta adresine gelen şifre sıfırlama kodunu gir:"
                );


            if (!code) {

                return;

            }


            await signIn.attemptFirstFactor({
                strategy:
                    "reset_password_email_code",
                code:
                    code
            });


            const newPassword =
                prompt(
                    "Yeni şifreni gir (en az 8 karakter):"
                );


            if (!newPassword) {

                return;

            }


            if (
                newPassword.length < 8
            ) {

                showMessage(
                    "Yeni şifre en az 8 karakter olmalı.",
                    "error"
                );

                return;

            }


            await signIn.resetPassword({
                password:
                    newPassword
            });


            if (
                signIn.status ===
                "complete"
            ) {

                await Clerk.setActive({
                    session:
                        signIn.createdSessionId
                });


                showMessage(
                    "Şifren yenilendi! Giriş yapılıyor...",
                    "success"
                );


                setTimeout(
                    function () {

                        window.location.href =
                            "/";

                    },
                    1000
                );

            }

        }

        catch (error) {

            console.error(
                "Şifre sıfırlama hatası:",
                error
            );


            showMessage(
                error?.errors?.[0]?.longMessage ||
                error?.message ||
                "Şifre sıfırlama işlemi başarısız oldu.",
                "error"
            );

        }

    }
);

</script>

</body>
</html>
